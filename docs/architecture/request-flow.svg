<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="704" viewBox="0 0 1040 704" role="img" aria-labelledby="title desc">
<title id="title">End-to-end request flow</title>
<desc id="desc">Sequence diagram across User, React client, NestJS API and PostgreSQL. Log in: the user submits email and password, zod validates, the client posts to /auth/login, the API finds the user by email, compares the bcrypt hash, signs a JWT and returns it; the client stores it and navigates to /invoices. Load list: the client sends GET /invoices with the Bearer token, the guard sets req.user, the API reads one page and the total count filtered by user_id and returns data and meta. Open detail: the user clicks a row, the client dispatches invoiceSelected, sends GET /invoices/:id, the API reads the first invoice matching id and user_id and returns the invoice or 404, and the modal shows the details.</desc>
<defs>
<style>
:root{--surface:#ffffff;--ink:#172024;--ink-2:#3a464b;--muted:#5c686d;--line:#cdd5d2;--client:#2a55c8;--client-tint:#e6ecfb;--api:#9c5600;--api-tint:#fbf0dd;--data:#0b7454;--data-tint:#dff2ea}
@media (prefers-color-scheme:dark){:root{--surface:#171d20;--ink:#e3e8e6;--ink-2:#c0cac7;--muted:#919ea2;--line:#2d373b;--client:#8aa7f7;--client-tint:#18223d;--api:#f0b25c;--api-tint:#2b2010;--data:#4fc89d;--data-tint:#0f2820}}
text{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--ink)}
.m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.t-title{font-weight:600;font-size:13.5px}
.t-lbl{font-size:11px;fill:var(--ink-2)}
.phase{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.tc{fill:var(--client-tint);stroke:var(--client);stroke-width:1.3}
.ta{fill:var(--api-tint);stroke:var(--api);stroke-width:1.3}
.td{fill:var(--data-tint);stroke:var(--data);stroke-width:1.3}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--ink-2)}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4}
.sep{stroke:var(--line);stroke-width:1}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="703" rx="12"/>
<g transform="translate(20,20)">

  <!-- lanes -->
  <rect class="box" x="10" y="10" width="140" height="38" rx="8"/>
  <text class="t-title" x="80" y="34" text-anchor="middle">User</text>
  <rect class="tc" x="255" y="10" width="150" height="38" rx="8"/>
  <text class="t-title" x="330" y="34" text-anchor="middle">React client</text>
  <rect class="ta" x="545" y="10" width="150" height="38" rx="8"/>
  <text class="t-title" x="620" y="34" text-anchor="middle">NestJS API</text>
  <rect class="td" x="815" y="10" width="150" height="38" rx="8"/>
  <text class="t-title" x="890" y="34" text-anchor="middle">PostgreSQL</text>
  <line class="life" x1="80" y1="48" x2="80" y2="656"/>
  <line class="life" x1="330" y1="48" x2="330" y2="656"/>
  <line class="life" x1="620" y1="48" x2="620" y2="656"/>
  <line class="life" x1="890" y1="48" x2="890" y2="656"/>

  <!-- phase: log in -->
  <line class="sep" x1="0" y1="66" x2="1000" y2="66"/>
  <text class="phase" x="996" y="61" text-anchor="end">LOG IN</text>

  <line class="edge" x1="80" y1="88" x2="330" y2="88" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="205" y="81" text-anchor="middle">submit email + password</text>

  <path class="edge" d="M330,104 h28 v14 h-28" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="366" y="115">zod validates the form</text>

  <line class="edge" x1="330" y1="150" x2="620" y2="150" marker-end="url(#arrow)"/>
  <text class="m t-lbl" x="475" y="143" text-anchor="middle">POST /auth/login</text>

  <line class="edge" x1="620" y1="178" x2="890" y2="178" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="755" y="171" text-anchor="middle">find user by email</text>

  <line class="edge dash" x1="890" y1="206" x2="620" y2="206" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="755" y="199" text-anchor="middle">row incl. password hash</text>

  <path class="edge" d="M620,222 h28 v14 h-28" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="656" y="233">bcrypt.compare → sign JWT</text>

  <line class="edge dash" x1="620" y1="268" x2="330" y2="268" marker-end="url(#arrow)"/>
  <text class="m t-lbl" x="475" y="261" text-anchor="middle">200 { accessToken, user }</text>

  <path class="edge" d="M330,284 h28 v14 h-28" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="366" y="295">loggedIn, go to /invoices</text>

  <!-- phase: list -->
  <line class="sep" x1="0" y1="318" x2="1000" y2="318"/>
  <text class="phase" x="996" y="313" text-anchor="end">LOAD LIST</text>

  <line class="edge" x1="330" y1="346" x2="620" y2="346" marker-end="url(#arrow)"/>
  <text class="m t-lbl" x="475" y="339" text-anchor="middle">GET /invoices?page=1 + Bearer</text>

  <path class="edge" d="M620,362 h28 v14 h-28" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="656" y="373">JwtAuthGuard sets req.user</text>

  <line class="edge" x1="620" y1="402" x2="890" y2="402" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="755" y="395" text-anchor="middle">where user_id = sub · page + count</text>

  <line class="edge dash" x1="890" y1="430" x2="620" y2="430" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="755" y="423" text-anchor="middle">rows + total</text>

  <line class="edge dash" x1="620" y1="458" x2="330" y2="458" marker-end="url(#arrow)"/>
  <text class="m t-lbl" x="475" y="451" text-anchor="middle">200 { data, meta }</text>

  <!-- phase: detail -->
  <line class="sep" x1="0" y1="476" x2="1000" y2="476"/>
  <text class="phase" x="996" y="471" text-anchor="end">OPEN DETAIL</text>

  <line class="edge" x1="80" y1="504" x2="330" y2="504" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="205" y="497" text-anchor="middle">click an invoice row</text>

  <path class="edge" d="M330,520 h28 v14 h-28" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="366" y="531">dispatch invoiceSelected(id)</text>

  <line class="edge" x1="330" y1="562" x2="620" y2="562" marker-end="url(#arrow)"/>
  <text class="m t-lbl" x="475" y="555" text-anchor="middle">GET /invoices/:id + Bearer</text>

  <line class="edge" x1="620" y1="590" x2="890" y2="590" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="755" y="583" text-anchor="middle">first() where id and user_id</text>

  <line class="edge dash" x1="620" y1="618" x2="330" y2="618" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="475" y="611" text-anchor="middle">200 invoice, or 404 if not theirs</text>

  <line class="edge dash" x1="330" y1="646" x2="80" y2="646" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="205" y="639" text-anchor="middle">modal shows the details</text>
</g>
</svg>
