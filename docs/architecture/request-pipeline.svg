<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="564" viewBox="0 0 1040 564" role="img" aria-labelledby="title desc">
<title id="title">API request pipeline</title>
<desc id="desc">Request pipeline for GET /invoices/42. The request passes LoggerMiddleware, JwtAuthGuard, ValidationPipe and ParseIntPipe, InvoicesController, InvoicesService and PrismaService to PostgreSQL, then returns 200 JSON. The guard throws 401 for a missing or bad token, the pipe throws 400 for an invalid id or query, and the service throws 404 when no invoice matches the id for this user. All three go to a global HttpExceptionFilter that returns a consistent error JSON.</desc>
<defs>
<style>
:root{--surface:#ffffff;--sunk:#e9edeb;--ink:#172024;--ink-2:#3a464b;--muted:#5c686d;--line:#cdd5d2;--client:#2a55c8;--client-tint:#e6ecfb;--api:#9c5600;--api-tint:#fbf0dd;--data:#0b7454;--data-tint:#dff2ea;--err:#b42318;--err-tint:#fdeceb}
@media (prefers-color-scheme:dark){:root{--surface:#171d20;--sunk:#1e262a;--ink:#e3e8e6;--ink-2:#c0cac7;--muted:#919ea2;--line:#2d373b;--client:#8aa7f7;--client-tint:#18223d;--api:#f0b25c;--api-tint:#2b2010;--data:#4fc89d;--data-tint:#0f2820;--err:#ff8b7d;--err-tint:#351512}}
text{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--ink)}
.m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.t-title{font-weight:600;font-size:13.5px}
.t-sub{fill:var(--muted);font-size:11.5px}
.t-lbl{font-size:11px;fill:var(--ink-2)}
.c-err{fill:var(--err)}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.ta{fill:var(--api-tint);stroke:var(--api);stroke-width:1.3}
.td{fill:var(--data-tint);stroke:var(--data);stroke-width:1.3}
.te{fill:var(--err-tint);stroke:var(--err);stroke-width:1.3}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--ink-2)}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="563" rx="12"/>
<g transform="translate(20,20)">

  <!-- happy-path return -->
  <path class="edge dash" d="M60,478 H34 V46 H60" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="24" y="262" text-anchor="middle" transform="rotate(-90 24 262)">200 · invoice JSON back to the client</text>

  <!-- stages -->
  <rect class="box" x="60" y="20" width="400" height="52" rx="8"/>
  <text class="m t-title" x="76" y="42">GET /invoices/42</text>
  <text class="m t-sub" x="76" y="60">Authorization: Bearer eyJhbGciOi…</text>
  <line class="edge" x1="260" y1="72" x2="260" y2="92" marker-end="url(#arrow)"/>

  <rect class="ta" x="60" y="92" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="114">LoggerMiddleware</text>
  <text class="t-sub" x="76" y="132">logs method, path, status, duration</text>
  <line class="edge" x1="260" y1="144" x2="260" y2="164" marker-end="url(#arrow)"/>

  <rect class="ta" x="60" y="164" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="186">JwtAuthGuard → JwtStrategy.validate()</text>
  <text class="t-sub" x="76" y="204">checks signature and expiry, sets req.user</text>
  <line class="edge" x1="260" y1="216" x2="260" y2="236" marker-end="url(#arrow)"/>

  <rect class="ta" x="60" y="236" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="258">ValidationPipe · ParseIntPipe</text>
  <text class="t-sub" x="76" y="276">id is an integer; page and limit within range</text>
  <line class="edge" x1="260" y1="288" x2="260" y2="308" marker-end="url(#arrow)"/>

  <rect class="ta" x="60" y="308" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="330">InvoicesController</text>
  <text class="m t-sub" x="76" y="348">findOne(@Param('id') id, @CurrentUser() user)</text>
  <line class="edge" x1="260" y1="360" x2="260" y2="380" marker-end="url(#arrow)"/>

  <rect class="ta" x="60" y="380" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="402">InvoicesService</text>
  <text class="m t-sub" x="76" y="420">invoice.findFirst({ where: { id, userId } })</text>
  <line class="edge" x1="260" y1="432" x2="260" y2="452" marker-end="url(#arrow)"/>

  <rect class="td" x="60" y="452" width="400" height="52" rx="8"/>
  <text class="t-title" x="76" y="474">PrismaService → PostgreSQL</text>
  <text class="m t-sub" x="76" y="492">SELECT … WHERE id = $1 AND user_id = $2</text>

  <!-- error exits -->
  <line class="edge" x1="460" y1="190" x2="540" y2="190" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="500" y="182" text-anchor="middle">throws</text>
  <rect class="te" x="540" y="168" width="170" height="44" rx="22"/>
  <text class="t-title c-err" x="625" y="186" text-anchor="middle">401 Unauthorized</text>
  <text class="t-sub" x="625" y="203" text-anchor="middle">missing or bad token</text>

  <line class="edge" x1="460" y1="262" x2="540" y2="262" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="500" y="254" text-anchor="middle">throws</text>
  <rect class="te" x="540" y="240" width="170" height="44" rx="22"/>
  <text class="t-title c-err" x="625" y="258" text-anchor="middle">400 Bad Request</text>
  <text class="t-sub" x="625" y="275" text-anchor="middle">invalid id or query</text>

  <line class="edge" x1="460" y1="406" x2="540" y2="406" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="500" y="398" text-anchor="middle">throws</text>
  <rect class="te" x="540" y="384" width="170" height="44" rx="22"/>
  <text class="t-title c-err" x="625" y="402" text-anchor="middle">404 Not Found</text>
  <text class="t-sub" x="625" y="419" text-anchor="middle">no invoice for this user</text>

  <!-- filter -->
  <line class="edge" x1="710" y1="190" x2="780" y2="190" marker-end="url(#arrow)"/>
  <line class="edge" x1="710" y1="262" x2="780" y2="262" marker-end="url(#arrow)"/>
  <line class="edge" x1="710" y1="406" x2="780" y2="406" marker-end="url(#arrow)"/>
  <rect class="box" x="780" y="160" width="200" height="276" rx="10"/>
  <text class="t-title" x="880" y="272" text-anchor="middle">HttpExceptionFilter</text>
  <text class="t-sub" x="880" y="292" text-anchor="middle">global, registered in main.ts</text>
  <text class="m t-sub" x="880" y="320" text-anchor="middle">{ statusCode, message,</text>
  <text class="m t-sub" x="880" y="338" text-anchor="middle">path, timestamp }</text>
  <line class="edge" x1="880" y1="436" x2="880" y2="476" marker-end="url(#arrow)"/>
  <rect class="te" x="780" y="476" width="200" height="36" rx="18"/>
  <text class="t-title" x="880" y="499" text-anchor="middle">error JSON to client</text>
</g>
</svg>
