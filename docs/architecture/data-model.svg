<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
<title id="title">Data model</title>
<desc id="desc">Entity relationship diagram. User has id, email (unique), password (bcrypt hash) and name. Invoice has id, user_id (foreign key to users.id, indexed), vendor_name, amount as Decimal 12,2, due_date, description and paid (default false). One user owns many invoices.</desc>
<defs>
<style>
:root{--surface:#ffffff;--ink:#172024;--ink-2:#3a464b;--muted:#5c686d;--line:#cdd5d2;--data:#0b7454;--data-tint:#dff2ea}
@media (prefers-color-scheme:dark){:root{--surface:#171d20;--ink:#e3e8e6;--ink-2:#c0cac7;--muted:#919ea2;--line:#2d373b;--data:#4fc89d;--data-tint:#0f2820}}
text{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--ink)}
.m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.t-title{font-weight:600;font-size:13.5px}
.t-sub{fill:var(--muted);font-size:11.5px}
.t-lbl{font-size:11px;fill:var(--ink-2)}
.c-data{fill:var(--data)}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.ent{fill:var(--surface);stroke:var(--data);stroke-width:1.3}
.ent-o{fill:none;stroke:var(--data);stroke-width:1.3}
.hd{fill:var(--data-tint)}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.sep{stroke:var(--line);stroke-width:1}
.sep-d{stroke:var(--data);stroke-width:1;opacity:.45}
</style>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="339" rx="12"/>
<g transform="translate(20,20)">

  <!-- User -->
  <rect class="ent" x="100" y="30" width="300" height="160" rx="8"/>
  <path class="hd" d="M101,70 V38 Q101,31 108,31 H392 Q399,31 399,38 V70 Z"/>
  <rect class="ent-o" x="100" y="30" width="300" height="160" rx="8"/>
  <line class="sep-d" x1="100" y1="70" x2="400" y2="70"/>
  <text class="t-title" x="116" y="56">User</text>
  <text class="m t-sub" x="384" y="56" text-anchor="end">table users</text>
  <text class="m" x="116" y="90">id</text><text class="m t-sub" x="384" y="90" text-anchor="end">Int · PK</text>
  <line class="sep" x1="100" y1="100" x2="400" y2="100"/>
  <text class="m" x="116" y="120">email</text><text class="m t-sub" x="384" y="120" text-anchor="end">String · unique</text>
  <line class="sep" x1="100" y1="130" x2="400" y2="130"/>
  <text class="m" x="116" y="150">password</text><text class="m t-sub" x="384" y="150" text-anchor="end">String · bcrypt hash</text>
  <line class="sep" x1="100" y1="160" x2="400" y2="160"/>
  <text class="m" x="116" y="180">name</text><text class="m t-sub" x="384" y="180" text-anchor="end">String</text>

  <!-- Invoice -->
  <rect class="ent" x="600" y="30" width="320" height="250" rx="8"/>
  <path class="hd" d="M601,70 V38 Q601,31 608,31 H912 Q919,31 919,38 V70 Z"/>
  <rect class="ent-o" x="600" y="30" width="320" height="250" rx="8"/>
  <line class="sep-d" x1="600" y1="70" x2="920" y2="70"/>
  <text class="t-title" x="616" y="56">Invoice</text>
  <text class="m t-sub" x="904" y="56" text-anchor="end">table invoices</text>
  <text class="m" x="616" y="90">id</text><text class="m t-sub" x="904" y="90" text-anchor="end">Int · PK</text>
  <line class="sep" x1="600" y1="100" x2="920" y2="100"/>
  <text class="m c-data" x="616" y="120">user_id</text><text class="m t-sub" x="904" y="120" text-anchor="end">Int · FK → users.id · indexed</text>
  <line class="sep" x1="600" y1="130" x2="920" y2="130"/>
  <text class="m" x="616" y="150">vendor_name</text><text class="m t-sub" x="904" y="150" text-anchor="end">String</text>
  <line class="sep" x1="600" y1="160" x2="920" y2="160"/>
  <text class="m" x="616" y="180">amount</text><text class="m t-sub" x="904" y="180" text-anchor="end">Decimal(12,2)</text>
  <line class="sep" x1="600" y1="190" x2="920" y2="190"/>
  <text class="m" x="616" y="210">due_date</text><text class="m t-sub" x="904" y="210" text-anchor="end">DateTime</text>
  <line class="sep" x1="600" y1="220" x2="920" y2="220"/>
  <text class="m" x="616" y="240">description</text><text class="m t-sub" x="904" y="240" text-anchor="end">String</text>
  <line class="sep" x1="600" y1="250" x2="920" y2="250"/>
  <text class="m" x="616" y="270">paid</text><text class="m t-sub" x="904" y="270" text-anchor="end">Boolean · default false</text>

  <!-- relation -->
  <path class="edge" d="M400,85 H500 V115 H600"/>
  <line class="edge" x1="412" y1="77" x2="412" y2="93"/>
  <line class="edge" x1="584" y1="115" x2="600" y2="106"/>
  <line class="edge" x1="584" y1="115" x2="600" y2="124"/>
  <text class="t-lbl" x="424" y="78">1</text>
  <text class="t-lbl" x="462" y="78" text-anchor="middle">owns</text>
  <text class="t-lbl" x="572" y="107" text-anchor="end">many</text>
</g>
</svg>
