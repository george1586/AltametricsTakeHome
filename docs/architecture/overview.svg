<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="376" viewBox="0 0 1040 376" role="img" aria-labelledby="title desc">
<title id="title">System overview</title>
<desc id="desc">The React client on port 5173 calls the NestJS API on port 3000 over HTTP with a Bearer JWT and gets JSON back. Only the API talks to PostgreSQL, which runs in Docker on port 5432, through the Prisma 8 ORM. Prisma db init and the seed script writes the schema and demo data. Playwright drives the client in end-to-end tests.</desc>
<defs>
<style>
:root{--surface:#ffffff;--sunk:#e9edeb;--ink:#172024;--ink-2:#3a464b;--muted:#5c686d;--line:#cdd5d2;--client:#2a55c8;--client-tint:#e6ecfb;--api:#9c5600;--api-tint:#fbf0dd;--data:#0b7454;--data-tint:#dff2ea;--err:#b42318;--err-tint:#fdeceb}
@media (prefers-color-scheme:dark){:root{--surface:#171d20;--sunk:#1e262a;--ink:#e3e8e6;--ink-2:#c0cac7;--muted:#919ea2;--line:#2d373b;--client:#8aa7f7;--client-tint:#18223d;--api:#f0b25c;--api-tint:#2b2010;--data:#4fc89d;--data-tint:#0f2820;--err:#ff8b7d;--err-tint:#351512}}
text{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--ink)}
.m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.t-title{font-weight:600;font-size:13.5px}
.t-head{font-weight:600;font-size:13px}
.t-sub{fill:var(--muted);font-size:11.5px}
.t-lbl{font-size:11px;fill:var(--ink-2)}
.c-client{fill:var(--client)}.c-api{fill:var(--api)}.c-data{fill:var(--data)}.c-err{fill:var(--err)}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.tc{fill:var(--client-tint);stroke:var(--client);stroke-width:1.3}
.ta{fill:var(--api-tint);stroke:var(--api);stroke-width:1.3}
.td{fill:var(--data-tint);stroke:var(--data);stroke-width:1.3}
.te{fill:var(--err-tint);stroke:var(--err);stroke-width:1.3}
.tool{stroke:var(--muted);stroke-dasharray:5 4}
.sw-tool{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:3 2}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.ah{fill:var(--ink-2)}
.sep{stroke:var(--line);stroke-width:1}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="375" rx="12"/>
<g transform="translate(20,20)">

  <!-- client -->
  <rect class="tc" x="20" y="20" width="260" height="180" rx="10"/>
  <text class="m t-head c-client" x="36" y="46">client/</text>
  <text class="t-sub" x="36" y="64">Vite dev server · :5173</text>
  <rect class="box" x="36" y="80" width="228" height="104" rx="6"/>
  <text class="t-title" x="150" y="104" text-anchor="middle">React SPA</text>
  <text class="t-sub" x="150" y="126" text-anchor="middle">React Router · Redux Toolkit</text>
  <text class="t-sub" x="150" y="146" text-anchor="middle">TanStack Query · Axios</text>
  <text class="t-sub" x="150" y="166" text-anchor="middle">Zod · Tailwind · TanStack Table</text>

  <!-- api -->
  <rect class="ta" x="370" y="20" width="260" height="180" rx="10"/>
  <text class="m t-head c-api" x="386" y="46">server/</text>
  <text class="t-sub" x="386" y="64">NestJS · :3000</text>
  <rect class="box" x="386" y="80" width="228" height="104" rx="6"/>
  <text class="t-title" x="500" y="104" text-anchor="middle">Nest application</text>
  <text class="t-sub" x="500" y="126" text-anchor="middle">AuthModule · Passport JWT</text>
  <text class="t-sub" x="500" y="146" text-anchor="middle">InvoicesModule</text>
  <text class="t-sub" x="500" y="166" text-anchor="middle">DbModule · db (Prisma 8)</text>

  <!-- data -->
  <rect class="td" x="720" y="20" width="260" height="180" rx="10"/>
  <text class="m t-head c-data" x="736" y="46">docker-compose.yaml</text>
  <text class="t-sub" x="736" y="64">postgres:19 · :5432 · volume pgdata</text>
  <path class="box" d="M780,94 L780,164 A70,10 0 0 0 920,164 L920,94 Z"/>
  <ellipse class="box" cx="850" cy="94" rx="70" ry="10"/>
  <text class="t-title" x="850" y="128" text-anchor="middle">PostgreSQL</text>
  <text class="m t-sub" x="850" y="148" text-anchor="middle">users · invoices</text>

  <!-- client <-> api -->
  <line class="edge" x1="280" y1="112" x2="370" y2="112" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="104" text-anchor="middle">HTTP + Bearer</text>
  <line class="edge" x1="370" y1="152" x2="280" y2="152" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="170" text-anchor="middle">JSON</text>

  <!-- api <-> db -->
  <line class="edge" x1="630" y1="132" x2="720" y2="132" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="675" y="124" text-anchor="middle">Prisma 8 ORM</text>
  <text class="t-lbl" x="675" y="148" text-anchor="middle">SQL</text>

  <!-- playwright -->
  <rect class="box tool" x="20" y="244" width="260" height="52" rx="8"/>
  <text class="t-title" x="150" y="266" text-anchor="middle">Playwright e2e</text>
  <text class="t-sub" x="150" y="284" text-anchor="middle">logs in, expects invoice rows</text>
  <line class="edge" x1="150" y1="244" x2="150" y2="200" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="158" y="226">drives the browser</text>

  <!-- seed -->
  <rect class="box tool" x="370" y="244" width="260" height="52" rx="8"/>
  <text class="m t-title" x="500" y="266" text-anchor="middle">prisma db init · npm run seed</text>
  <text class="t-sub" x="500" y="284" text-anchor="middle">run from server/</text>
  <path class="edge" d="M630,270 H850 V200" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="640" y="262">creates tables, inserts demo data</text>

  <!-- legend -->
  <line class="sep" x1="0" y1="312" x2="1000" y2="312"/>
  <rect class="tc" x="20" y="322" width="14" height="14" rx="3"/>
  <text class="t-lbl" x="42" y="333">Client (browser)</text>
  <rect class="ta" x="170" y="322" width="14" height="14" rx="3"/>
  <text class="t-lbl" x="192" y="333">API (NestJS)</text>
  <rect class="td" x="300" y="322" width="14" height="14" rx="3"/>
  <text class="t-lbl" x="322" y="333">Data (PostgreSQL, Prisma)</text>
  <rect class="te" x="490" y="322" width="14" height="14" rx="7"/>
  <text class="t-lbl" x="512" y="333">Error response</text>
  <rect class="sw-tool" x="620" y="322" width="14" height="14" rx="3"/>
  <text class="t-lbl" x="642" y="333">Dev / test tooling, not part of the running app</text>
</g>
</svg>
