<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="596" viewBox="0 0 1040 596" role="img" aria-labelledby="title desc">
<title id="title">Client state ownership</title>
<desc id="desc">The Redux store holds authSlice (token, user) and uiSlice (selectedInvoiceId, page). LoginPage validates with zod, calls the login mutation and dispatches loggedIn. ProtectedRoute reads the token and redirects to /login if missing. InvoiceTable dispatches invoiceSelected on row click and reads rows from the ['invoices', page] query. InvoiceModal reads the selected id from Redux and fetches ['invoice', id]. All queries call one axios instance, which adds the Bearer token and calls the NestJS API. A 401 response dispatches loggedOut.</desc>
<defs>
<style>
:root{--surface:#ffffff;--sunk:#e9edeb;--ink:#172024;--ink-2:#3a464b;--muted:#5c686d;--line:#cdd5d2;--client:#2a55c8;--client-tint:#e6ecfb;--api:#9c5600;--api-tint:#fbf0dd}
@media (prefers-color-scheme:dark){:root{--surface:#171d20;--sunk:#1e262a;--ink:#e3e8e6;--ink-2:#c0cac7;--muted:#919ea2;--line:#2d373b;--client:#8aa7f7;--client-tint:#18223d;--api:#f0b25c;--api-tint:#2b2010}}
text{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--ink)}
.m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.t-title{font-weight:600;font-size:13.5px}
.t-sub{fill:var(--muted);font-size:11.5px}
.t-lbl{font-size:11px;fill:var(--ink-2)}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.panel{fill:var(--sunk);stroke:var(--line);stroke-width:1.2}
.tc{fill:var(--client-tint);stroke:var(--client);stroke-width:1.3}
.ta{fill:var(--api-tint);stroke:var(--api);stroke-width:1.3}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--ink-2)}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="595" rx="12"/>
<g transform="translate(20,20)">

  <!-- Redux store -->
  <rect class="panel" x="20" y="20" width="260" height="392" rx="10"/>
  <text class="t-title" x="36" y="44">Redux Toolkit store</text>
  <text class="m t-sub" x="264" y="44" text-anchor="end">store/</text>
  <rect class="tc" x="36" y="62" width="228" height="136" rx="6"/>
  <text class="m t-title" x="52" y="86">authSlice</text>
  <text class="m t-sub" x="52" y="110">token: string | null</text>
  <text class="m t-sub" x="52" y="128">user: { id, email, name }</text>
  <text class="t-sub" x="52" y="156">loggedIn · loggedOut</text>
  <text class="t-sub" x="52" y="176">token mirrored to localStorage</text>
  <rect class="tc" x="36" y="246" width="228" height="138" rx="6"/>
  <text class="m t-title" x="52" y="270">uiSlice</text>
  <text class="m t-sub" x="52" y="294">selectedInvoiceId</text>
  <text class="m t-sub" x="52" y="312">page</text>
  <text class="t-sub" x="52" y="340">invoiceSelected(id | null)</text>
  <text class="t-sub" x="52" y="360">pageChanged</text>

  <!-- Routes / components -->
  <text class="t-title" x="500" y="44" text-anchor="middle">Routes and components</text>
  <rect class="tc" x="370" y="62" width="260" height="56" rx="6"/>
  <text class="t-title" x="386" y="85">LoginPage</text>
  <text class="m t-sub" x="614" y="85" text-anchor="end">/login</text>
  <text class="t-sub" x="386" y="105">zod loginSchema validates the form</text>
  <rect class="tc" x="370" y="142" width="260" height="56" rx="6"/>
  <text class="t-title" x="386" y="165">ProtectedRoute</text>
  <text class="t-sub" x="386" y="185">no token → redirect to /login</text>
  <rect class="panel" x="370" y="222" width="260" height="190" rx="8"/>
  <text class="t-title" x="386" y="243">InvoicesPage</text>
  <text class="m t-sub" x="614" y="243" text-anchor="end">/invoices</text>
  <rect class="tc" x="386" y="256" width="228" height="48" rx="6"/>
  <text class="t-title" x="402" y="276">InvoiceTable</text>
  <text class="t-sub" x="402" y="294">TanStack Table · row click</text>
  <rect class="tc" x="386" y="340" width="228" height="48" rx="6"/>
  <text class="t-title" x="402" y="360">InvoiceModal</text>
  <text class="t-sub" x="402" y="378">open while an id is selected</text>

  <!-- React Query cache -->
  <rect class="panel" x="720" y="20" width="260" height="392" rx="10"/>
  <text class="t-title" x="736" y="44">TanStack Query cache</text>
  <rect class="tc" x="736" y="62" width="228" height="56" rx="6"/>
  <text class="m t-title" x="752" y="85">useMutation(login)</text>
  <text class="t-sub" x="752" y="105">mutation · POST /auth/login</text>
  <text class="t-sub" x="850" y="176" text-anchor="middle">each queryFn calls axios;</text>
  <text class="t-sub" x="850" y="194" text-anchor="middle">zod parses the response</text>
  <rect class="tc" x="736" y="256" width="228" height="48" rx="6"/>
  <text class="m t-title" x="752" y="276">['invoices', page]</text>
  <text class="t-sub" x="752" y="294">GET /invoices?page&amp;limit</text>
  <rect class="tc" x="736" y="340" width="228" height="48" rx="6"/>
  <text class="m t-title" x="752" y="360">['invoice', id]</text>
  <text class="t-sub" x="752" y="378">GET /invoices/:id · enabled: !!id</text>

  <!-- store <-> components -->
  <line class="edge" x1="370" y1="90" x2="280" y2="90" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="82" text-anchor="middle">loggedIn</text>
  <line class="edge" x1="280" y1="170" x2="370" y2="170" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="162" text-anchor="middle">token?</text>
  <line class="edge" x1="386" y1="280" x2="280" y2="280" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="272" text-anchor="middle">invoiceSelected</text>
  <line class="edge" x1="280" y1="364" x2="386" y2="364" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="325" y="356" text-anchor="middle">selected id</text>

  <!-- components -> queries -->
  <line class="edge" x1="630" y1="90" x2="736" y2="90" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="675" y="82" text-anchor="middle">mutate</text>
  <line class="edge" x1="614" y1="280" x2="736" y2="280" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="675" y="272" text-anchor="middle">useQuery</text>
  <line class="edge" x1="614" y1="364" x2="736" y2="364" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="675" y="356" text-anchor="middle">useQuery (id)</text>

  <!-- axios + api -->
  <line class="edge" x1="850" y1="412" x2="850" y2="448" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="858" y="434">queryFn</text>
  <rect class="tc" x="720" y="448" width="260" height="64" rx="8"/>
  <text class="t-title" x="736" y="471">axios instance</text>
  <text class="m t-sub" x="964" y="471" text-anchor="end">api/http.ts</text>
  <text class="t-sub" x="736" y="493">baseURL · adds Bearer from the store</text>
  <rect class="ta" x="370" y="448" width="260" height="64" rx="8"/>
  <text class="t-title" x="386" y="471">NestJS API</text>
  <text class="m t-sub" x="614" y="471" text-anchor="end">:3000</text>
  <text class="t-sub" x="386" y="493">see the request pipeline</text>
  <line class="edge" x1="720" y1="480" x2="630" y2="480" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="675" y="472" text-anchor="middle">HTTP</text>
  <path class="edge dash" d="M850,512 V540 H150 V412" marker-end="url(#arrow)"/>
  <text class="t-lbl" x="500" y="533" text-anchor="middle">on 401: dispatch(loggedOut())</text>
</g>
</svg>
